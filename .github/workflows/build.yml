name: Build and Deploy APK to Firebase

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with: 
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1. GitHub Secrets에서 Keystore를 복원하고 key.properties 생성 (릴리스 서명용)
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Check Release SHA-1
        run: |
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            | grep -E "Alias name:|SHA1:|SHA256:"
            
      # 2. 안드로이드 릴리스 APK 빌드 (GitHub Run Number를 빌드 번호로 활용)
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # 3. Firebase App Distribution을 통해 파이어베이스로 즉시 업로드
      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app 1:76487740850:android:3e648c4bcfdb8b26f4a8ab --token "${{ secrets.FIREBASE_TOKEN }}" --groups "testers"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # 4. Firestore에 배포된 버전 기록 자동 저장
      - name: Save Release Info to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          npm init -y > /dev/null 2>&1
          npm install firebase-admin > /dev/null 2>&1

          node -e '
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);

          initializeApp({
            credential: cert(serviceAccount)
          });

          const db = getFirestore();

          async function saveRelease() {
            const buildNumber = process.env.BUILD_NUMBER;
            const commitMessage = process.env.COMMIT_MSG || "자동 배포 릴리스";
            const releaseUrl = "https://appdistribution.firebase.google.com/testerapps/1:76487740850:android:3e648c4bcfdb8b26f4a8ab";

            await db.collection("app_releases").add({
              version: `1.0.${buildNumber}`,
              buildNumber: parseInt(buildNumber, 10),
              releaseNotes: commitMessage,
              downloadUrl: releaseUrl,
              createdAt: FieldValue.serverTimestamp(),
              platform: "android"
            });

            console.log(`Firestore에 v1.0.${buildNumber} 릴리스 기록이 성공적으로 저장되었습니다.`);
          }

          saveRelease().catch((err) => {
            console.error("Firestore 저장 실패:", err);
            process.exit(1);
          });
          '