name: Build Mobile App and Deploy with Web

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1. 안드로이드 APK 빌드
      - name: Build APK
        run: flutter build apk --release

      # 2. 파이어베이스 배포용 폴더(public) 세팅
      - name: Prepare Hosting Directory
        run: |
          mkdir -p public
          
          # [핵심] 기존 웹서비스 파일들을 public 폴더로 복사해 옵니다.
          # (만약 웹 파일들이 다른 레포에 있다면 깃 클론을 해오거나, 이 레포 내에 web_dist 폴더 등으로 관리할 수 있습니다)
          # 예시: cp -r web_dist/* public/
          
          # 3. 빌드된 APK를 웹 파일들이 있는 public 폴더 안으로 쏙 복사
          cp build/app/outputs/flutter-apk/app-release.apk public/app-release.apk

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}